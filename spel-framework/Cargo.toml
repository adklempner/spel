[package]
name = "spel-framework"
version = "0.5.0"
edition = "2021"
description = "Developer framework for building SPEL programs (like Anchor for Solana)"

[features]
default = []
host = ["dep:nssa", "spel-framework-core/host"]

[dependencies]
spel-framework-core = { path = "../spel-framework-core" }
spel-framework-macros = { path = "../spel-framework-macros" }
nssa_core = { package = "lee_core", path = "../../lssa/lee/state_machine/core", features = ["host"] }
nssa = { package = "lee", path = "../../lssa/lee/state_machine", optional = true }
borsh = { version = "1.0", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
